<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Conti delle lezioni Mee Too</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --crema:#f5f0e8; --crema-fonda:#ece4d8; --carta:#fbf8f3; --scuro:#2c2c2c; --tenue:#6f6a63;
  --bg:var(--crema); --fg:var(--scuro); --fg-2:#5a554e; --sup:var(--carta); --sup-2:var(--crema-fonda);
  --bordo:#ddd3c4; --accent:#a8876a; --salvia:#7d8b78;
  --ok:#317A3F; --ok-tinta:#dfe9dc; --att:#B8860B; --att-tinta:#f3e6c8; --neg:#A93226; --neg-tinta:#f1d9d4;
  --ign:#8c857c; --ign-tinta:#ebe6de; --esempio:#9C7C96;
  --d-macchine:#A8876A; --d-matwork:#7D8B78; --d-yoga:#B4776B; --d-funzionale:#7C8B96; --d-somatica:#9C7C96; --d-mam:#B0896F; --d-evento:#2C2C2C;
  --r:10px; --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#262422; --fg:#f0eae0; --fg-2:#c4bcb0; --sup:#312e2b; --sup-2:#3a3633; --bordo:#4a4540; --accent:#c9a98a; --salvia:#9dae98;
    --ok:#5CA66A; --ok-tinta:#2d3f30; --att:#D9A23A; --att-tinta:#473b22; --neg:#E0523C; --neg-tinta:#4a2b26;
    --ign:#8c857c; --ign-tinta:#383431; --esempio:#bc9db6;
    --d-macchine:#c9a98a; --d-matwork:#9dae98; --d-yoga:#d4978a; --d-funzionale:#9caeba; --d-somatica:#bc9db6; --d-mam:#d2b096; --d-evento:#e8e0d4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#262422; --fg:#f0eae0; --fg-2:#c4bcb0; --sup:#312e2b; --sup-2:#3a3633; --bordo:#4a4540; --accent:#c9a98a; --salvia:#9dae98;
  --ok:#5CA66A; --ok-tinta:#2d3f30; --att:#D9A23A; --att-tinta:#473b22; --neg:#E0523C; --neg-tinta:#4a2b26;
  --ign:#8c857c; --ign-tinta:#383431; --esempio:#bc9db6;
  --d-macchine:#c9a98a; --d-matwork:#9dae98; --d-yoga:#d4978a; --d-funzionale:#9caeba; --d-somatica:#bc9db6; --d-mam:#d2b096; --d-evento:#e8e0d4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0 auto;max-width:1180px;padding-inline:16px;padding-block:10px 96px;background:var(--bg);color:var(--fg);
  font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.riga.tot .num{font-size:17px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(22px,3.4vw,30px)}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
button{font:inherit;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muto{color:var(--fg-2)}
.piccolo{font-size:13px}
.occhiello{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}

/* testata */
.testata{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;padding-block:8px 14px}
.logo{display:inline-flex;align-items:center;gap:7px;color:var(--fg)}
.logo svg{display:block}
.testata .meta{display:grid;gap:3px;text-align:right}
@media (max-width:600px){.testata .meta{text-align:left}}

/* menù */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;gap:2px;background:var(--sup);border-top:1px solid var(--bordo);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.voce{flex:1 1 0;min-height:52px;border:0;background:transparent;color:var(--fg-2);display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:600;border-radius:12px;padding:4px 2px;letter-spacing:.01em}
.voce svg{width:22px;height:22px;display:block}
.voce[aria-selected="true"]{color:var(--fg);background:var(--sup-2)}
.voce.sec{display:none}
.altro-menu{position:fixed;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--sup);border:1px solid var(--bordo);border-radius:14px;padding:6px;display:grid;gap:2px;box-shadow:0 12px 32px rgba(0,0,0,.22);min-width:180px}
.altro-menu button{min-height:46px;border:0;background:transparent;color:var(--fg);padding:8px 16px;text-align:left;border-radius:10px;font-size:16px;font-weight:500}
.altro-menu button[aria-selected="true"]{background:var(--sup-2)}
.voce:focus-visible,.altro-menu button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:960px){
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--bordo);background:var(--bg);justify-content:flex-start;gap:6px;padding:8px 0 10px;margin-bottom:16px}
  .voce{flex:0 0 auto;min-height:44px;padding:0 14px;grid-auto-flow:column;align-items:center;gap:8px;font-size:14px}
  .voce svg{width:18px;height:18px}
  .voce.sec{display:grid}.voce.altro{display:none}.altro-menu{display:none!important}
}
.vista{display:grid;gap:18px}
.bottone{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 14px;font-weight:500}
.bottone.secondario{background:transparent;color:var(--fg)}
.bottone.piccolo{padding:5px 10px;font-size:13px}

/* avvisi */
.avviso{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;border:1px solid var(--bordo);background:var(--sup)}
.avviso.esempio{border-color:var(--esempio);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--esempio) 12%,transparent) 10px 12px),var(--sup)}
.avviso .testo{display:grid;gap:2px;flex:1 1 280px}
.avviso strong{font-weight:600}

/* tessere */
.tessere{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tessera{background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.tessera .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:600}
.tessera .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.tessera .s{font-size:13px;color:var(--fg-2)}
.pos{color:var(--ok)} .negv{color:var(--neg)}

/* settimana */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bordo);background:var(--sup);color:var(--fg);border-radius:10px;padding:8px 11px;min-height:48px;font-weight:500;display:grid;gap:0;text-align:center;min-width:64px}
.chip small{font-size:12px;color:var(--fg-2);font-weight:400}
.chip[aria-selected="true"]{border-color:var(--fg);background:var(--sup-2)}
.settimana{display:grid;grid-template-columns:1fr;gap:14px}
.giorno{display:grid;gap:8px;align-content:start}
.giorno.off{display:none}
.giorno header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-inline:2px}
.giorno header h3{font-size:14px;font-weight:600}
@media (min-width:960px){
  .chips{display:none}
  .settimana{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .giorno.off{display:grid}
}
.lez{--st:var(--ign);display:grid;grid-template-columns:1fr auto;gap:1px 8px;align-items:baseline;text-align:left;width:100%;
  padding:9px 11px 9px 10px;border-radius:var(--r);background:var(--sup);border:1px solid var(--bordo);border-left:5px solid var(--st);color:var(--fg)}
.lez[data-st="ok"]{--st:var(--ok);background:var(--ok-tinta)}
.lez[data-st="att"]{--st:var(--att);background:var(--att-tinta)}
.lez[data-st="neg"]{--st:var(--neg);background:var(--neg-tinta)}
.lez[data-st="fuori"]{opacity:.6;border-style:dashed}
.lez .ora{font-weight:600;font-size:14px}
.lez .marg{font-weight:600;font-size:16px;text-align:right;white-space:nowrap}
.lez .nome{grid-column:1/-1;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.lez .nome span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lez .nome .sotto{color:var(--fg-2);font-weight:400;font-size:13px}
.lez .meta{grid-column:1/-1;font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pallino{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.lez .stato{grid-column:1/-1;font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:6px;min-width:0}
.lez .stato span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glifo{width:15px;height:15px;border-radius:50%;background:var(--st);color:#fff;font-size:10px;font-weight:700;display:inline-grid;place-items:center;flex:none;line-height:1}
@media (max-width:959px){.lez{grid-template-columns:auto 1fr auto;column-gap:10px}.lez .nome{grid-column:2;grid-row:1}.lez .ora{grid-row:1}.lez .marg{grid-row:1;font-size:17px}.lez .meta{grid-column:1/-1}.lez .stato{grid-column:1/-1}}

/* dettaglio */
dialog{border:0;border-radius:16px;max-width:560px;width:calc(100% - 24px);padding:0;background:var(--sup);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,25,20,.45)}
.dlg{padding:18px 18px 20px;display:grid;gap:14px;max-height:88vh;overflow:auto}
.dlg .intesta{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chiudi{border:1px solid var(--bordo);background:var(--sup-2);color:var(--fg);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:16px;flex:none}
.conto{display:grid;gap:0;border-top:1px solid var(--bordo)}
.conto .r{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--bordo);align-items:baseline}
.conto .r small{display:block;color:var(--fg-2);font-size:13px}
.conto .r.tot{font-weight:600;font-size:16px}
.conto .r .v{text-align:right;font-weight:500}
.griglia2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.griglia2{grid-template-columns:1fr}}
.campo{display:grid;gap:4px}
.campo label{font-size:13px;color:var(--fg-2);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1px solid var(--bordo);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
input[type="number"]{text-align:right;font-variant-numeric:tabular-nums}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--fg)}
input[type="range"]{padding:0;accent-color:var(--fg)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:140px}
.tabellina{width:100%;border-collapse:collapse;font-size:13.5px}
.tabellina th,.tabellina td{padding:6px 6px;border-bottom:1px solid var(--bordo);text-align:right;white-space:nowrap}
.tabellina th:first-child,.tabellina td:first-child{text-align:left}
.tabellina th{font-weight:600;color:var(--fg-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tabellina tr.sel td{font-weight:600}
.tabellina td.ok{color:var(--ok)} .tabellina td.att{color:var(--att)} .tabellina td.neg{color:var(--neg)}
.bolla{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 7px;font-size:13.5px;font-weight:500;background:var(--sup-2)}
.bolla.ok{background:var(--ok-tinta)} .bolla.att{background:var(--att-tinta)} .bolla.neg{background:var(--neg-tinta)}

/* tipologie */
.carte{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.carta{background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px;border-top:4px solid var(--dc)}
.carta header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.carta header .n{display:flex;align-items:center;gap:8px}
.fatti{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fatto{display:grid;gap:1px}
.fatto .k{font-size:12px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fatto .v{font-size:17px;font-weight:600}
.fatto .v small{font-size:13px;font-weight:400;color:var(--fg-2)}
.grafico{width:100%;height:auto;display:block}
.grafico text{font-family:var(--font)}

/* dati */
.blocco{background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.blocco h2{font-size:16px}
.riga{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}
.riga.tre{grid-template-columns:1fr 150px 110px 44px}
@media (max-width:560px){.riga.tre{grid-template-columns:1fr 1fr;grid-auto-rows:auto}.riga.tre .x{grid-column:2;justify-self:end}}
.riga.tot{border-top:1px solid var(--bordo);padding-top:8px;font-weight:600}
.riga.tot .num{text-align:right}
.x{border:1px solid var(--bordo);background:transparent;color:var(--fg-2);border-radius:10px;width:44px;height:44px;display:grid;place-items:center}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.nota{font-size:13.5px;color:var(--fg-2);line-height:1.4}
details{border:1px solid var(--bordo);border-radius:var(--r);background:var(--sup)}
details summary{padding:10px 14px;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--fg-2)}
details[open] summary::after{content:"–"}
details .dentro{padding:0 14px 12px;display:grid;gap:8px}
.slotriga{display:grid;grid-template-columns:52px 1fr 1fr 80px;gap:8px;align-items:center;font-size:14px}
@media (max-width:560px){.slotriga{grid-template-columns:52px 1fr 80px}.slotriga select{grid-column:1/-1;grid-row:2}.slotriga input{grid-row:1;grid-column:3}}
.dicui{border:1px solid var(--bordo);background:transparent;color:var(--fg-2);border-radius:999px;padding:6px 11px;font-size:13px;margin-left:4px;min-height:36px}
.dicui[aria-expanded="true"]{background:var(--sup-2);color:var(--fg)}
.slotcomp{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:2px 0 8px 52px;border-bottom:1px dashed var(--bordo)}
.slotcomp label{display:grid;gap:2px;color:var(--fg-2)}
.slotcomp input{width:72px;padding:6px 6px}
@media (max-width:560px){.slotcomp{padding-left:0}}
.cancello{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.cancello-card{width:min(100%,380px);background:var(--sup);border:1px solid var(--bordo);border-radius:16px;padding:22px 20px;display:grid;gap:12px;margin:0}
.cancello-card .logo{justify-self:start}
.cancello-card .bottone{min-height:48px}
.cancello-card h2{font-size:20px}
.ricorda{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--fg-2)}
.salvataggio{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:999px;opacity:.94;max-width:min(80vw,320px)}
.salvataggio[data-ok="1"]{background:var(--sup-2);color:var(--fg-2);border:1px solid var(--bordo)}
@media (min-width:960px){body{padding-bottom:48px}.salvataggio{bottom:12px}}
.insriga{display:grid;grid-template-columns:1fr 76px 108px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bordo)}
.insriga span small{display:block;color:var(--fg-2);font-size:13px;font-weight:400}
.insriga input{padding:6px 6px}
.insriga.intesta{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);font-weight:600;padding-bottom:4px}
.insriga.intesta span:not(:first-child),.insriga.tot span:last-child{text-align:right}
.insriga.tot{font-weight:600;border-bottom:0;padding-top:10px}
.codins{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0 10px;border-bottom:1px dashed var(--bordo)}
.codins input{flex:1 1 180px;min-height:40px}
.lezform{display:grid;grid-template-columns:110px 1fr 1fr 80px auto;gap:6px;align-items:center;padding-top:8px;border-top:1px dashed var(--bordo)}
.lezform input,.lezform select{padding:6px 8px}
@media (max-width:640px){.lezform{grid-template-columns:1fr 1fr}.lezform button{grid-column:1/-1}}
.lezecc{display:grid;gap:2px}
.ecc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 6px 8px}
.ecc select{min-height:36px;width:auto;font-size:14px;padding:4px 8px;margin-left:4px}
.dicui.on{background:var(--neg-tinta);color:var(--neg);border-color:var(--neg)}
.lezecc.conecc .lez{opacity:.7}
body.istruttore .nav,body.istruttore .salvataggio,body.istruttore .altro-menu,body.istruttore #avvisi{display:none!important}
body.app .testata,body.app .solo-fuori-app{display:none!important}
body.app{padding-top:4px}
body.istruttore{padding-bottom:48px;position:relative;line-height:1.6}
body.istruttore::before{content:"";position:fixed;inset:-12px;z-index:-2;background:url(sfondo-studio.jpg) center/cover no-repeat;filter:blur(2px) saturate(1.05) brightness(.95)}
body.istruttore::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(44,44,44,.58),rgba(44,44,44,.72) 50%,rgba(44,44,44,.86))}
body.istruttore{background:#2c2c2c}
body.istruttore .ist-piede span{color:#d9d2c6}
body.istruttore .testata,body.istruttore .ist-testa{background:var(--sup);border:1px solid var(--bordo);border-radius:18px;padding:16px 18px}
body.istruttore .testata{margin-top:4px;margin-bottom:30px}
body.istruttore .testata{padding-bottom:18px}
#istruttore{gap:26px}
.ist-testa{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ist-testa h2{font-size:26px;margin:4px 0 6px}
.ist-mese{display:flex;align-items:center;gap:10px;background:var(--sup);border:1px solid var(--bordo);border-radius:14px;padding:6px 12px}
.ist-mese input{border:0;background:transparent;min-height:40px;padding:0;width:auto}
.ico{width:24px;height:24px;flex:none}.ico.grande{width:34px;height:34px;color:var(--accent)}
.ist-tessere{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ist-tessera{display:flex;gap:14px;align-items:flex-start;background:var(--sup);box-shadow:0 6px 24px rgba(44,44,44,.08);border:1px solid var(--bordo);border-radius:18px;padding:18px 16px 16px}
.ist-tessera>div{display:grid;gap:4px}
.ist-tessera .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:600}
.ist-tessera .v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ist-tessera .s{font-size:13px;color:var(--fg-2);line-height:1.4}
@media (max-width:420px){.ist-tessere{grid-template-columns:1fr}}
.ist-stato{display:flex;gap:14px;align-items:center;background:var(--att-tinta);border:1px solid var(--bordo);border-radius:16px;padding:14px 16px}
.ist-stato.ok{background:var(--ok-tinta)}
.ist-stato .glifo{width:26px;height:26px;font-size:13px}
.ist-stato b{display:block;font-weight:600}.ist-stato span{display:block;color:var(--fg-2);font-size:14px}
.ist-blocco{background:var(--sup);box-shadow:0 6px 24px rgba(44,44,44,.08);border:1px solid var(--bordo);border-radius:18px;padding:18px 18px 10px;display:grid;gap:4px}
.ist-blocco h3{font-size:17px;margin-bottom:2px}
.ist-blocco>.piccolo{margin-bottom:10px}
details.tipo{border:0;border-top:1px solid var(--bordo);border-radius:0;background:transparent}
details.tipo summary::after{content:none}
details.tipo summary{padding-inline:4px}
details.tipo summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:16px 4px;cursor:pointer;min-height:56px}
details.tipo summary::-webkit-details-marker{display:none}
details.tipo .ico{color:var(--accent)}
.tipo .nome{font-weight:500;font-size:16px}.tipo .nome small{display:block;color:var(--fg-2);font-size:13px;font-weight:400;margin-top:2px}
.tipo .n{font-size:20px;font-weight:600}
.tipo .chev{color:var(--fg-2);font-size:22px;transition:transform .15s}
details.tipo[open] .chev{transform:rotate(90deg)}
.giorni{display:grid;gap:0;padding:0 4px 14px 42px}
.gio{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px dashed var(--bordo);font-size:15px}
.gio .data{font-weight:600;padding-top:4px}
.orari{display:flex;flex-wrap:wrap;gap:6px}
.orach{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--sup-2);font-size:14px;font-weight:500}
.orach small{font-weight:400;color:var(--fg-2);font-size:12px}
.orach.no{opacity:.55;text-decoration:line-through}
.orach.fut{background:transparent;border:1px dashed var(--bordo);color:var(--fg-2);font-weight:400}
.orach.no small{text-decoration:none}
.tipo.tot,.tipo.stor{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 4px;border-top:1px solid var(--bordo)}
.tipo.tot .nome{font-weight:600}
.tipo.stor .nome small{display:block;color:var(--fg-2);font-size:13px;font-weight:400}
.ist-piede{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px}
.cose{display:grid;gap:8px}
.cosa{--st:var(--ign);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--sup);border:1px solid var(--bordo);border-left:5px solid var(--st)}
.cosa[data-st="ok"]{--st:var(--ok)}.cosa[data-st="att"]{--st:var(--att)}.cosa[data-st="neg"]{--st:var(--neg)}
.cosa b{display:block;font-weight:600}.cosa span{display:block;color:var(--fg-2);font-size:13.5px;line-height:1.35}
.cosa .glifo{width:22px;height:22px;font-size:12px}
.cosa .bottone{min-height:40px;white-space:nowrap}
@media (max-width:480px){.cosa{grid-template-columns:auto 1fr}.cosa .bottone{grid-column:2;justify-self:start}}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:no-preference){.lez{transition:transform .12s ease}.lez:hover{transform:translateY(-1px)}}

function grafico(margini,soglia,nSel){
  const N=margini.length,W=340,H=170,pl=6,pr=6,pt=22,pb=24;
  const maxV=Math.max(0,...margini),minV=Math.min(0,...margini),span=(maxV-minV)||1;
  const y=v=>pt+(maxV-v)/span*(H-pt-pb); const bw=(W-pl-pr)/N;
  let s=`<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Margine per numero di persone presenti">`;
  s+=`<text x="${pl}" y="11" font-size="10" fill="var(--fg-2)">margine in euro, per numero di persone presenti</text>`;
  if(soglia>0&&soglia<=maxV) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(soglia)}" y2="${y(soglia)}" stroke="var(--att)" stroke-dasharray="3 3"/><text x="${W-pr}" y="${y(soglia)-3}" text-anchor="end" font-size="9.5" fill="var(--fg-2)">la tua ora ${eur(soglia)}</text>`;
  margini.forEach((m,i)=>{ const n=i+1,x=pl+i*bw+bw*.2,w=bw*.6,top=Math.min(y(m),y(0)),hh=Math.abs(y(m)-y(0));
    const col=m<0?'var(--neg)':(m<soglia?'var(--att)':'var(--ok)'); const sel=nSel===n;
    s+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh,1.5).toFixed(1)}" rx="3" fill="${col}" opacity="${(nSel==null||sel)?1:.5}"/>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${(m>=0?top-4:top+hh+11).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="${sel?700:500}" fill="var(--fg)">${segno(m)}</text>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--fg-2)">${n}</text>`; });
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--fg-2)" stroke-width="1"/></svg>`;
  return s;
}

    <div class="riga"><label for="d-sett">Settimane all’anno con lezioni <span class="muto piccolo">(52 meno le chiusure)</span></label><input id="d-sett" type="number" min="1" max="52" step="1" inputmode="numeric" value="${S.settimaneAperte}" data-k="settimaneAperte" data-tipo="int"></div>
    <div class="riga tot"><span>Quota fissa su ogni lezione <small class="muto" style="font-weight:400;display:block">spese dell’anno diviso le lezioni dell’anno: ${eur(totSpese())} × 12 ÷ (${fmt(lezioniSett(),2)} × ${S.settimaneAperte})</small></span><span class="num" data-calc="quota">${eur(qf,2)}</span></div></div>
  <div class="blocco"><h2>Insegnanti</h2><p class="nota">Per ciascuna, come viene pagata. Per te (titolare) non c’è un costo: nella tua riga scrivi quanto vale la tua ora. Sotto ogni insegnante puoi darle un suo codice: con quello, dallo stesso link, vede solo il proprio riepilogo del mese (lezioni fatte e cifra che le spetta), senza poter modificare nulla e senza vedere le altre.</p>${righeIns}
    <div><button class="bottone secondario piccolo" data-az="aggiungi-ins">+ Aggiungi un’insegnante</button></div>
</div>
  <div class="blocco"><h2>Le lezioni della settimana</h2><p class="nota">Chi tiene ogni lezione e quante persone ci sono in media. Con “di cui” puoi dire quante hanno la singola o ciascun pacchetto: allora il conto usa quei prezzi invece della media. “Togli” leva una lezione dal palinsesto (si può rimettere), e in fondo a ogni giornata puoi aggiungerne una nuova. Vale per tutte le viste.</p>${giorni}</div>
  <div class="blocco"><h2>Come pagano le clienti</h2><p class="nota">Su 100 presenze, quante arrivano con la singola e quante con ciascun pacchetto. Serve per il prezzo medio di una presenza nelle lezioni dove non hai scritto il dettaglio “di cui”.</p>${mix}</div>
  <div class="blocco"><h2>Altre voci</h2>
    <div class="riga"><label for="d-var">Costi che nascono solo se la lezione si fa (€ a lezione)</label><input id="d-var" type="number" min="0" step="0.5" inputmode="decimal" value="${S.variabili||''}" placeholder="0" data-k="variabili" data-tipo="num"></div>
    <div class="riga"><label for="d-tasse">Tasse e contributi da mettere da parte (%) <span class="muto piccolo">la cifra la dà il commercialista</span></label><input id="d-tasse" type="number" min="0" max="80" step="1" inputmode="numeric" value="${S.tasse||''}" placeholder="0" data-k="tasse" data-tipo="num"></div>
    <h3 style="margin-top:4px">Cosa contare</h3>
    <label class="riga" style="grid-template-columns:1fr 24px"><span>Laboratorio esperienziale del venerdì</span><input type="checkbox" ${S.includi.somatica?'checked':''} data-k="includi/somatica" data-tipo="bool"></label>
    <label class="riga" style="grid-template-columns:1fr 24px"><span>Workshop</span><input type="checkbox" ${S.includi.evento?'checked':''} data-k="includi/evento" data-tipo="bool"></label></div>
  <div class="blocco"><h2>Codice di accesso</h2><p class="nota">Con questo codice entri nella pagina da qualsiasi dispositivo. Per cambiarlo scrivi quello nuovo: almeno 6 caratteri, maiuscole e minuscole non contano.</p>
    <div class="riga" style="grid-template-columns:1fr auto"><input id="d-nuovo-codice" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="nuovo codice" aria-label="Nuovo codice"><button class="bottone secondario piccolo" data-az="cambia-codice">Cambia codice</button></div><p class="nota" id="d-esito-codice"></p>
    <div class="solo-fuori-app"><button class="bottone secondario piccolo" data-az="esci">Esci da questo dispositivo</button></div></div>
  <div class="blocco"><h2>Copia di sicurezza</h2><p class="nota">Il testo qui sotto è tutto quello che hai inserito, già salvato online. Serve solo se vuoi tenerne una copia o ripristinarla con “Carica il testo incollato”.</p>
    <textarea id="d-json" aria-label="Dati in formato testo" spellcheck="false">${esc(JSON.stringify(S))}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="bottone secondario piccolo" data-az="copia">Copia</button><button class="bottone secondario piccolo" data-az="incolla">Carica il testo incollato</button><span style="flex:1"></span><button class="bottone secondario piccolo" data-az="esempio">Guarda i numeri di esempio</button><button class="bottone secondario piccolo" data-az="azzera">Svuota tutto</button></div><p class="nota" id="d-esito"></p></div>`;
}

/* ============ EVENTI ============ */
function setPath(path,val){ const parts=path.split('/'); let o=S; for(let i=0;i<parts.length-1;i++){ const p=parts[i]; if(o[p]==null||typeof o[p]!=='object') o[p]=isNaN(+parts[i+1])?{}:{}; o=o[p]; } o[parts[parts.length-1]]=val; }
function leggi(el){ const t=el.dataset.tipo; if(t==='bool') return el.checked; const v=el.value; if(t==='num'||t==='int'){ if(v==='') return null; const n=t==='int'?parseInt(v,10):parseFloat(v); return isNaN(n)?null:n; } return v; }
function aggiornaCalcolati(){ const q=$('[data-calc="tot-spese"]'); if(q) q.textContent=eur(totSpese()); const qq=$('[data-calc="quota"]'); if(qq) qq.textContent=eur(quotaFissa(),2);
  for(const d in S.mix){ const e=$(`[data-calc="somma-${d}"]`); if(!e) continue; const somma=Object.keys(DISC[d].prezzi).reduce((a,k)=>a+num(S.mix[d][k]),0); e.textContent=somma===100?'prezzo medio '+eur(prezzoMedio(d),2):'il totale fa '+fmt(somma)+'%, deve fare 100'; e.className='piccolo num '+(somma===100?'muto':'negv'); }
  const j=$('#d-json'); if(j&&document.activeElement!==j) j.value=JSON.stringify(S); }

document.addEventListener('input',e=>{ const el=e.target;
  if(el.dataset.sim){ const k=el.dataset.sim; SIM[k]=k==='disc'||k==='ins'?el.value:(el.value===''?null:+el.value); if(k==='disc'){SIM.pm=null;SIM.posti=null;} if(k==='n'||k==='posti'||k==='pm'||k==='qf'||k==='costo') renderSimulatore(); else renderSimulatore(); if(k==='n'){ const r=$('#s-n'); if(r) r.focus(); } return; }
  if(el.dataset.mese||el.dataset.scegliGiorno||el.dataset.ecc||el.dataset.meseIns) return; if(!el.dataset.k) return; setPath(el.dataset.k,leggi(el)); salva(); aggiornaCalcolati(); });
document.addEventListener('change',e=>{ const el=e.target; if(el.dataset.sim) return; if(el.dataset.mese){ meseSel=el.value||meseSel; renderMese(); return; }
  if(el.dataset.scegliGiorno){ if(el.value) dataSel=el.value; renderOggi(); return; }
  if(el.dataset.meseIns){ if(el.value) meseIns=el.value; renderIstruttore(); return; }
  if(el.dataset.ecc){ const d=el.dataset.data,k=el.dataset.k; const ass=(S.slot[k]||{}).ins||''; const v=el.value; setEcc(d,k,(v===ass)?null:{tipo:'sostituita',ins:v}); salva(); dopoEcc(); return; }
  if(!el.dataset.k) return;
  setPath(el.dataset.k,leggi(el)); const mk=el.dataset.k.match(/^chiusure\/([^/]+)\/lezioni\/(.+)$/); if(mk&&S.chiusure[mk[1]]&&S.chiusure[mk[1]].importi) delete S.chiusure[mk[1]].importi[mk[2]]; salva();
  const dlg=$('#dettaglio'); if(dlg.open&&dlg.contains(el)){ const l=PAL.find(x=>key(x)===dlg.dataset.k); const f=document.activeElement&&document.activeElement.id; dlg.innerHTML=htmlDettaglio(l); if(f){const nf=$('#'+f); if(nf&&nf.tagName!=='INPUT') nf.focus();} render(); return; }
  if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='number') { const id=el.id; render(); if(id){ const nf=$('#'+id); if(nf&&nf.tagName==='SELECT') nf.focus(); } } });
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-vista]'); if(tab){ vista=tab.dataset.vista; if(tab.dataset.ym) meseSel=tab.dataset.ym; vaiA(vista); return; }
  if(e.target.closest('[data-az="altro"]')){ const m=$('#altro-menu'); m.hidden=!m.hidden; $('.voce.altro').setAttribute('aria-expanded',String(!m.hidden)); return; }
  if(!e.target.closest('#altro-menu')) { const m=$('#altro-menu'); if(m&&!m.hidden){ m.hidden=true; $('.voce.altro').setAttribute('aria-expanded','false'); } }
  const chip=e.target.closest('[data-giorno]'); if(chip){ giornoSel=chip.dataset.giorno; renderSettimana(); return; }
  const lez=e.target.closest('.lez'); if(lez){ apriDettaglio(lez.dataset.k,lez.dataset.data||null); return; }
  if(e.target.closest('[data-az="sett-prec"]')){ const d=lunediDi(settBase); d.setDate(d.getDate()-7); settBase=isoDi(d); renderSettimana(); return; }
  if(e.target.closest('[data-az="sett-succ"]')){ const d=lunediDi(settBase); d.setDate(d.getDate()+7); settBase=isoDi(d); renderSettimana(); return; }
  if(e.target.closest('[data-az="sett-oggi"]')){ settBase=isoDi(lunediDi(oggiISO())); renderSettimana(); return; }
  const az=e.target.closest('[data-az]'); if(!az) return; const a=az.dataset.az;
  if(a==='chiudi'){ $('#dettaglio').close(); return; }
  if(a==='dicui'){ const riga=az.closest('.slotriga'); const sub=riga&&riga.nextElementSibling; if(sub){ sub.hidden=!sub.hidden; az.setAttribute('aria-expanded',String(!sub.hidden)); } return; }
  if(a==='vai-dati'){ $('[data-vista="dati"]').click(); return; }
  if(a==='usa-miei'){ S=VERI||cacheLocale()||DEFAULT(); VERI=null; render(); $('[data-vista="dati"]').click(); return; }
  if(a==='esempio'){ if(!S.esempio) VERI=S; S=esempio(); render(); window.scrollTo({top:0}); return; }
  if(a==='esci'){ esci(); return; }
  if(a==='ins-codice'||a==='ins-codice-togli'){ const i=+az.dataset.i; const ins=S.insegnanti[i]; const out=$(`[data-esito-codins="${i}"]`); const inp=$(`[data-codins="${i}"]`);
    (async()=>{ try{ let r; if(a==='ins-codice'){ const nuovo=(inp.value||'').trim(); if(nuovo.length<6){ out.textContent=MSG.corto; return; } r=await rpc('conti_istruttore_codice',{p_id:SUPA.id,p_codice:CODICE,p_ins:ins.id,p_nuovo:nuovo}); if(r.ok){ ins.accesso=true; salva(); renderDati(); const o2=$(`[data-esito-codins="${i}"]`); if(o2) o2.textContent='Codice attivo: daglielo a voce, entra dallo stesso link.'; return; } }
        else { r=await rpc('conti_istruttore_togli_codice',{p_id:SUPA.id,p_codice:CODICE,p_ins:ins.id}); if(r.ok){ ins.accesso=false; salva(); renderDati(); return; } }
        out.textContent=MSG[r.errore]||('Errore: '+r.errore); }catch(e){ out.textContent='Non riesco a collegarmi: riprova.'; } })(); return; }
  if(a==='ecc-salta'){ const d=az.dataset.data,k=az.dataset.k; const e=eccDi(d,k); setEcc(d,k,(e&&e.tipo==='saltata')?null:{tipo:'saltata'}); salva(); dopoEcc(); return; }
  if(a==='ecc-togli'){ setEcc(az.dataset.data,az.dataset.k,null); salva(); renderMese(); return; }
  if(a==='togli-lez'){ const kk=az.dataset.k; const l=PAL.find(x=>key(x)===kk); if(!l) return; if(l.extra){ S.extra=(S.extra||[]).filter(e=>(e.g+'|'+e.ora)!==kk); } else { S.rimosse=S.rimosse||[]; if(!S.rimosse.includes(kk)) S.rimosse.push(kk); } salva(); render(); return; }
  if(a==='rimetti-lez'){ S.rimosse=(S.rimosse||[]).filter(x=>x!==az.dataset.k); salva(); render(); return; }
  if(a==='aggiungi-lez'){ const f=az.closest('.lezform'); const g=f.dataset.g; const q=c=>f.querySelector(`[data-campo="${c}"]`); const err=q('errore'); let ora=(q('ora').value||'').trim().replace(':','.'); const mm=ora.match(/^(\d{1,2})\.(\d{2})$/); if(!mm||+mm[1]>23||+mm[2]>59){ err.textContent='Scrivi l’ora come 12.30'; return; } ora=(+mm[1])+'.'+mm[2];
    if(PAL.some(l=>l.g===g&&l.ora===ora)){ err.textContent='C’è già una lezione a quell’ora'; return; } const disc=q('disc').value; const posti=num(q('posti').value)||(disc==='macchine'?4:7); const sotto=(q('sotto').value||'').trim()||null;
    S.extra=S.extra||[]; S.extra.push({g,ora,disc,nome:DISC[disc].nome,sotto,posti}); S.rimosse=(S.rimosse||[]).filter(x=>x!==g+'|'+ora); salva(); render(); return; }
  if(a==='aggiungi-spesa-mese'){ const C=S.chiusure[meseSel]=S.chiusure[meseSel]||{}; C.spese=C.spese||[]; C.spese.push({voce:'',importo:null}); salva(); renderMese(); return; }
  if(a==='togli-spesa-mese'){ const C=S.chiusure[meseSel]||{}; (C.spese||[]).splice(+az.dataset.i,1); salva(); renderMese(); return; }
  if(a==='chiudi-mese'){ const k=contoMese(meseSel); const C=S.chiusure[meseSel]=S.chiusure[meseSel]||{}; C.chiuso=true; C.riepilogo={incasso:k.inc,insegnanti:k.insTot,spese:k.fisse+k.extra,utile:k.utile,tasse:k.tasse,riserva:k.riserva,bonifico:Math.max(0,k.bonifico),perIns:Object.fromEntries(k.righe.map(r=>[r.ins.id,{nome:r.ins.nome,lezioni:r.n,importo:r.imp}])),chiusoIl:new Date().toISOString()}; if(C.incasso==null) C.incasso=Math.round(k.inc); salva(); const prossimo=meseSuccessivo(meseSel); const d0=new Date(); d0.setDate(1); if(prossimo<=ymDi(d0)) meseSel=prossimo; renderMese(); window.scrollTo({top:0}); return; }
  if(a==='riapri-mese'){ const C=S.chiusure[meseSel]; if(C){ C.chiuso=false; delete C.riepilogo; } salva(); renderMese(); return; }
  if(a==='vai-mese'){ meseSel=az.dataset.ym; renderMese(); window.scrollTo({top:0}); return; }
  if(a==='cambia-codice'){ cambiaCodice($('#d-nuovo-codice').value); return; }
  if(a==='azzera'){ if(az.dataset.conf!=='1'){ az.dataset.conf='1'; az.textContent='Sicura? Premi ancora per svuotare'; return; } S=DEFAULT(); VERI=null; salva(); render(); return; }
  if(a==='aggiungi-spesa'){ S.spese.push({voce:'',importo:null}); salva(); renderDati(); const ins=document.querySelectorAll('[data-k^="spese/"][data-tipo="str"]'); ins[ins.length-1]?.focus(); return; }
  if(a==='togli-spesa'){ S.spese.splice(+az.dataset.i,1); salva(); renderDati(); return; }
  if(a==='aggiungi-ins'){ S.insegnanti.push({id:'ins'+Date.now().toString(36),nome:'',tipo:'ora',importo:null}); salva(); renderDati(); const ins=document.querySelectorAll('[data-k^="insegnanti/"][data-tipo="str"]'); ins[ins.length-1]?.focus(); return; }
  if(a==='togli-ins'){ const id=S.insegnanti[+az.dataset.i].id; S.insegnanti.splice(+az.dataset.i,1); for(const k in S.slot) if(S.slot[k].ins===id) S.slot[k].ins=null; salva(); renderDati(); return; }
  if(a==='copia'){ const t=$('#d-json'); t.select(); let ok=false; try{ navigator.clipboard?.writeText(t.value).then(()=>{$('#d-esito').textContent='Copiato. Incollalo in un messaggio a Mattia.';}); ok=true; }catch(err){} if(!ok){ try{ ok=document.execCommand('copy'); }catch(err){} $('#d-esito').textContent=ok?'Copiato.':'Non riesco a copiare da solo: tieni premuto sul testo e copia a mano.'; } return; }
  if(a==='incolla'){ try{ const o=JSON.parse($('#d-json').value); if(!o||typeof o!=='object'||!Array.isArray(o.spese)) throw 0; S=Object.assign(DEFAULT(),o); S.esempio=false; VERI=null; salva(); render(); $('#d-esito').textContent='Dati caricati e salvati.'; }catch(err){ $('#d-esito').textContent='Il testo incollato non è nel formato giusto.'; } return; }
});
$('#dettaglio').addEventListener('click',e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });
$('#dettaglio').addEventListener('close',()=>render());
render();
(function(){ try{ $('#c-logo').innerHTML=$('.testata .logo').innerHTML; }catch(e){}
  if(APP){ document.body.classList.add('app'); $('#c-form').hidden=true; const out=$('#c-app'); out.hidden=false; out.textContent='Un attimo…'; $('#cancello').hidden=false;
    window.addEventListener('message',e=>{ if(e.origin!==location.origin) return; const d=e.data||{}; if(d.tipo==='sessione'&&d.token){ const primo=!APP_TOKEN; APP_TOKEN=d.token; if(primo) entraAdmin(); } });
    try{ parent.postMessage({tipo:'pronto'},location.origin); }catch(e){}
    setTimeout(()=>{ if(!APP_TOKEN) out.textContent='Non ricevo la sessione dall’app. Ricarica la pagina.'; },8000); return; }
  $('#c-form').addEventListener('submit',e=>{ e.preventDefault(); entra($('#c-codice').value,$('#c-ricorda').checked); });
  let c=null, pers=false; try{ c=sessionStorage.getItem(CODICE_KEY); if(c) pers=codicePersistente(); else { c=localStorage.getItem(CODICE_KEY); pers=!!c; } }catch(e){}
  if(c) entra(c,pers,true); else mostraCancello(''); })();
</script>
